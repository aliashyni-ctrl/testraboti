<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Тест Supabase</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <h1>Тест соединения с Supabase</h1>
    <button id="testBtn">Проверить регистрацию</button>
    <pre id="log" style="background:#f0f0f0; padding:10px; margin-top:20px;"></pre>

    <script>
        const supabase = window.supabase.createClient(
            'https://ojbebhddhtreghvwkwjk.supabase.co',
            'sb_publishable_vc_joq6JVnaFzjhjn_W6GQ_S8o4843u'
        );

        const logDiv = document.getElementById('log');
        function log(msg) {
            logDiv.innerText += msg + '\n';
            console.log(msg);
        }

        document.getElementById('testBtn').onclick = async () => {
            logDiv.innerText = '';
            log('Начинаем тест...');
            const email = 'test_' + Date.now() + '@temp.local';
            const password = '12345678';
            log('Пробуем зарегистрировать: ' + email);
            try {
                const { data, error } = await supabase.auth.signUp({ email, password });
                if (error) throw error;
                log('✅ Успех! Пользователь создан: ' + data.user.id);
                log('Теперь проверьте таблицу users в Supabase, там должна быть запись.');
            } catch (err) {
                log('❌ Ошибка: ' + err.message);
                if (err.message.includes('fetch')) log('❌ Скорее всего, CORS или сеть. Добавьте URL в настройки Supabase.');
            }
        };
    </script>
</body>
</html>
