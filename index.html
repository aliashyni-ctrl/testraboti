<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Голубь | Мессенджер</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #f0f2f5;
            height: 100vh;
            overflow: hidden;
        }
        .app {
            display: flex;
            height: 100%;
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
        }
        .sidebar {
            width: 320px;
            background: #fff;
            border-right: 1px solid #e9ecef;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s ease;
            z-index: 10;
        }
        .sidebar-header {
            padding: 16px 20px;
            border-bottom: 1px solid #e9ecef;
            background: #fff;
        }
        .sidebar-header h2 {
            font-size: 1.4rem;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .search-box {
            position: relative;
            margin-bottom: 8px;
        }
        .search-box input {
            width: 100%;
            padding: 10px 16px 10px 36px;
            border: 1px solid #e9ecef;
            border-radius: 24px;
            font-size: 0.9rem;
            background: #f5f6f8;
            transition: 0.2s;
        }
        .search-box input:focus {
            outline: none;
            border-color: #667eea;
            background: white;
        }
        .search-box .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #8e9aaf;
            font-size: 1.1rem;
        }
        .user-info-sidebar {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 8px;
            padding: 8px 0;
        }
        .user-avatar-small {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            cursor: pointer;
        }
        .user-name-small {
            flex: 1;
            font-weight: 600;
        }
        .logout-btn-small {
            background: #ef4444;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .chats-list {
            flex: 1;
            overflow-y: auto;
        }
        .chat-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 20px;
            cursor: pointer;
            transition: background 0.1s;
            border-bottom: 1px solid #f0f2f5;
        }
        .chat-item:hover {
            background: #f5f7fb;
        }
        .chat-item.active {
            background: #eef2ff;
        }
        .chat-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
        }
        .chat-info {
            flex: 1;
            min-width: 0;
        }
        .chat-name {
            font-weight: 600;
            margin-bottom: 4px;
        }
        .chat-last-message {
            font-size: 0.75rem;
            color: #6c757d;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #f8f9fa;
        }
        .chat-header {
            background: white;
            padding: 12px 20px;
            border-bottom: 1px solid #e9ecef;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .chat-header .avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            object-fit: cover;
        }
        .chat-header-info {
            flex: 1;
        }
        .chat-header-name {
            font-weight: 600;
        }
        .chat-header-status {
            font-size: 0.7rem;
            color: #6c757d;
        }
        .chat-header-status.online {
            color: #22c55e;
        }
        .chat-actions {
            display: flex;
            gap: 12px;
        }
        .chat-actions button {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.2rem;
            color: #5f6b7a;
        }
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .message {
            max-width: 70%;
            padding: 8px 12px;
            border-radius: 18px;
            word-wrap: break-word;
            position: relative;
        }
        .message.own {
            align-self: flex-end;
            background: #667eea;
            color: white;
            border-bottom-right-radius: 4px;
        }
        .message.other {
            align-self: flex-start;
            background: white;
            border: 1px solid #e2e8f0;
            border-bottom-left-radius: 4px;
        }
        .message-sender {
            font-size: 0.7rem;
            font-weight: bold;
            margin-bottom: 4px;
        }
        .message-time {
            font-size: 0.65rem;
            text-align: right;
            margin-top: 4px;
            opacity: 0.7;
        }
        .input-area {
            background: white;
            padding: 12px 20px;
            border-top: 1px solid #e9ecef;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .input-area input {
            flex: 1;
            padding: 10px 16px;
            border: 1px solid #e9ecef;
            border-radius: 24px;
            font-size: 0.9rem;
            background: #f5f6f8;
        }
        .input-area input:focus {
            outline: none;
            border-color: #667eea;
        }
        .input-area button {
            background: #667eea;
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 24px;
            cursor: pointer;
        }
        .file-label {
            background: #e9ecef;
            padding: 8px;
            border-radius: 50%;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: white;
            width: 90%;
            max-width: 500px;
            border-radius: 24px;
            max-height: 80%;
            overflow-y: auto;
            padding: 20px;
        }
        .modal-content input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 12px;
            margin-bottom: 16px;
        }
        .search-result-item {
            padding: 10px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
        }
        .search-result-item:hover {
            background: #f5f7fb;
        }
        @media (max-width: 768px) {
            .sidebar {
                position: absolute;
                left: 0;
                top: 0;
                bottom: 0;
                transform: translateX(-100%);
                width: 280px;
                z-index: 20;
                background: white;
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .mobile-back {
                display: inline-block;
                cursor: pointer;
                margin-right: 10px;
                font-size: 1.2rem;
            }
        }
        .mobile-back {
            display: none;
        }
        .auth-screen {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }
        .auth-card {
            background: white;
            padding: 2rem;
            border-radius: 28px;
            width: 90%;
            max-width: 400px;
        }
        .auth-card h2 {
            text-align: center;
            margin-bottom: 1.5rem;
        }
        .auth-card input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ddd;
            border-radius: 16px;
        }
        .auth-card button {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 16px;
            margin-top: 12px;
            cursor: pointer;
        }
        .auth-card .toggle-link {
            text-align: center;
            margin-top: 12px;
            color: #667eea;
            cursor: pointer;
        }
        .avatar-preview {
            display: flex;
            justify-content: center;
            margin: 10px 0;
        }
        .avatar-preview img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
        }
        .error-text {
            color: red;
            text-align: center;
            margin-top: 10px;
        }
    </style>
</head>
<body>
<div class="app">
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h2>🐦 Голубь</h2>
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchChatsInput" placeholder="Поиск чатов...">
            </div>
            <div class="user-info-sidebar">
                <img id="sidebarAvatar" class="user-avatar-small" src="https://via.placeholder.com/40">
                <span id="sidebarName" class="user-name-small"></span>
                <button id="sidebarLogout" class="logout-btn-small">Выйти</button>
            </div>
        </div>
        <div class="chats-list" id="chatsList">Загрузка...</div>
    </div>
    <div class="chat-area">
        <div class="chat-header">
            <span class="mobile-back" id="mobileBackBtn">←</span>
            <img id="chatHeaderAvatar" class="avatar" src="https://via.placeholder.com/42">
            <div class="chat-header-info">
                <div class="chat-header-name" id="chatHeaderName"></div>
                <div class="chat-header-status" id="chatHeaderStatus"></div>
            </div>
            <div class="chat-actions">
                <button id="searchInChatBtn">🔍</button>
            </div>
        </div>
        <div class="messages-container" id="messagesContainer"></div>
        <div class="input-area">
            <label class="file-label">📎<input type="file" id="fileInput" style="display:none;"></label>
            <input type="text" id="messageInput" placeholder="Сообщение...">
            <button id="sendBtn">Отправить</button>
        </div>
    </div>
</div>
<div id="searchModal" class="modal">
    <div class="modal-content">
        <h3>Поиск в чате</h3>
        <input type="text" id="searchMessageInput" placeholder="Введите текст...">
        <div id="searchResultsList"></div>
        <button id="closeModal" style="margin-top:10px; width:100%;">Закрыть</button>
    </div>
</div>
<div id="authScreen" class="auth-screen">
    <div class="auth-card">
        <h2>🐦 Голубь</h2>
        <input type="text" id="authEmail" placeholder="Email или логин">
        <input type="password" id="authPassword" placeholder="Пароль (≥6)">
        <div id="avatarSection">
            <div class="avatar-preview">
                <img id="authAvatarPreview" src="https://via.placeholder.com/80">
            </div>
            <label style="display:block; text-align:center; margin:5px 0;">📷 Выбрать аватар
                <input type="file" id="authAvatarFile" accept="image/*" style="display:none;">
            </label>
        </div>
        <button id="authBtn">Зарегистрироваться</button>
        <div class="toggle-link" id="toggleAuthMode">Уже есть аккаунт? Войти</div>
        <div id="authError" class="error-text"></div>
    </div>
</div>

<script>
    // Единственное объявление клиента Supabase
    const supabaseClient = window.supabase.createClient(
        'https://ojbebhddhtreghvwkwjk.supabase.co',
        'sb_publishable_vc_joq6JVnaFzjhjn_W6GQ_S8o4843u'
    );

    let currentUser = null;
    let currentProfile = null;
    let activeChatUser = null;
    let currentChatId = null;
    let messagesSubscription = null;
    let onlineInterval = null;
    let isLoginMode = false;

    // DOM elements
    const authScreen = document.getElementById('authScreen');
    const authEmail = document.getElementById('authEmail');
    const authPassword = document.getElementById('authPassword');
    const authBtn = document.getElementById('authBtn');
    const toggleAuthMode = document.getElementById('toggleAuthMode');
    const authError = document.getElementById('authError');
    const authAvatarFile = document.getElementById('authAvatarFile');
    const authAvatarPreview = document.getElementById('authAvatarPreview');
    const avatarSection = document.getElementById('avatarSection');
    const sidebar = document.getElementById('sidebar');
    const chatsListDiv = document.getElementById('chatsList');
    const messagesDiv = document.getElementById('messagesContainer');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const sidebarAvatar = document.getElementById('sidebarAvatar');
    const sidebarName = document.getElementById('sidebarName');
    const sidebarLogout = document.getElementById('sidebarLogout');
    const chatHeaderAvatar = document.getElementById('chatHeaderAvatar');
    const chatHeaderName = document.getElementById('chatHeaderName');
    const chatHeaderStatus = document.getElementById('chatHeaderStatus');
    const fileInput = document.getElementById('fileInput');
    const mobileBackBtn = document.getElementById('mobileBackBtn');
    const searchChatsInput = document.getElementById('searchChatsInput');
    const searchInChatBtn = document.getElementById('searchInChatBtn');
    const searchModal = document.getElementById('searchModal');
    const searchMessageInput = document.getElementById('searchMessageInput');
    const searchResultsList = document.getElementById('searchResultsList');
    const closeModal = document.getElementById('closeModal');

    function showMessage(text) { alert(text); }
    function escapeHtml(str) { return str?.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'})[m]) || ''; }
    async function updateOnline(isOnline) {
        if (currentProfile) {
            await supabaseClient.from('users').update({ is_online: isOnline, last_seen_at: new Date().toISOString() }).eq('id', currentProfile.id);
        }
    }
    async function uploadAvatar(file, userId) {
        const ext = file.name.split('.').pop();
        const path = `${userId}/avatar.${ext}`;
        const { error } = await supabaseClient.storage.from('avatars').upload(path, file, { upsert: true });
        if (error) throw error;
        const { data } = supabaseClient.storage.from('avatars').getPublicUrl(path);
        return data.publicUrl;
    }
    async function updateUserAvatar(file) {
        try {
            const url = await uploadAvatar(file, currentProfile.id);
            await supabaseClient.from('users').update({ avatar_url: url }).eq('id', currentProfile.id);
            currentProfile.avatar_url = url;
            sidebarAvatar.src = url;
            await renderChatsList();
        } catch(e) { showMessage('Ошибка загрузки аватара: '+e.message); }
    }

    authAvatarFile.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = (ev) => authAvatarPreview.src = ev.target.result;
            reader.readAsDataURL(file);
        }
    });

    async function loadChats() {
        if (!currentProfile) return [];
        const { data, error } = await supabaseClient.from('users').select('*').neq('id', currentProfile.id);
        if (error) return [];
        return data;
    }
    async function renderChatsList() {
        let contacts = await loadChats();
        const searchTerm = searchChatsInput.value.trim().toLowerCase();
        if (searchTerm) {
            contacts = contacts.filter(c => (c.display_name || c.username).toLowerCase().includes(searchTerm));
        }
        chatsListDiv.innerHTML = '';
        if (!contacts.length) {
            chatsListDiv.innerHTML = '<div style="padding:20px;">Нет контактов</div>';
            return;
        }
        for (const c of contacts) {
            const div = document.createElement('div');
            div.className = 'chat-item';
            if (activeChatUser && activeChatUser.id === c.id) div.classList.add('active');
            div.innerHTML = `
                <img class="chat-avatar" src="${c.avatar_url || 'https://via.placeholder.com/50'}" onerror="this.src='https://via.placeholder.com/50'">
                <div class="chat-info">
                    <div class="chat-name">${escapeHtml(c.display_name || c.username)}</div>
                    <div class="chat-last-message"></div>
                </div>
            `;
            div.onclick = () => openChat(c);
            chatsListDiv.appendChild(div);
        }
    }

    async function getOrCreatePrivateChat(otherUserId) {
        const { data: myChats } = await supabaseClient.from('chat_members').select('chat_id').eq('user_id', currentProfile.id);
        const ids = myChats.map(c => c.chat_id);
        if (ids.length) {
            const { data: common } = await supabaseClient.from('chat_members').select('chat_id').in('chat_id', ids).eq('user_id', otherUserId);
            if (common && common.length) return common[0].chat_id;
        }
        const { data: newChat, error } = await supabaseClient.from('chats').insert({ type: 'private', created_by: currentProfile.id }).select().single();
        if (error || !newChat) return null;
        await supabaseClient.from('chat_members').insert([
            { chat_id: newChat.id, user_id: currentProfile.id, role: 'owner' },
            { chat_id: newChat.id, user_id: otherUserId, role: 'member' }
        ]);
        return newChat.id;
    }
    async function loadMessages(chatId) {
        const { data, error } = await supabaseClient
            .from('messages')
            .select('*, sender:users!sender_id(id, username, display_name)')
            .eq('chat_id', chatId)
            .order('created_at', { ascending: true });
        if (error) {
            console.error(error);
            return;
        }
        renderMessages(data);
    }
    function renderMessages(msgs) {
        messagesDiv.innerHTML = '';
        if (!msgs || msgs.length === 0) {
            messagesDiv.innerHTML = '<div style="text-align:center;color:gray;">Нет сообщений</div>';
            return;
        }
        msgs.forEach(msg => {
            const isOwn = msg.sender_id === currentProfile.id;
            const div = document.createElement('div');
            div.className = `message ${isOwn ? 'own' : 'other'}`;
            const sender = msg.sender?.display_name || msg.sender?.username || 'Пользователь';
            const time = new Date(msg.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            div.innerHTML = `${!isOwn ? `<div class="message-sender">${escapeHtml(sender)}</div>` : ''}<div>${escapeHtml(msg.content)}</div><div class="message-time">${time}</div>`;
            messagesDiv.appendChild(div);
        });
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }
    function subscribeToChat(chatId) {
        if (messagesSubscription) {
            supabaseClient.removeChannel(messagesSubscription);
        }
        messagesSubscription = supabaseClient
            .channel(`chat-${chatId}`)
            .on('postgres_changes', {
                event: 'INSERT',
                schema: 'public',
                table: 'messages',
                filter: `chat_id=eq.${chatId}`
            }, () => loadMessages(chatId))
            .subscribe((status, err) => {
                if (err) console.error('Subscribe error:', err);
            });
    }
    async function openChat(user) {
        activeChatUser = user;
        chatHeaderName.innerText = user.display_name || user.username;
        chatHeaderAvatar.src = user.avatar_url || 'https://via.placeholder.com/42';
        chatHeaderStatus.innerText = user.is_online ? 'В сети' : (user.last_seen_at ? 'был недавно' : 'офлайн');
        chatHeaderStatus.className = user.is_online ? 'chat-header-status online' : 'chat-header-status';
        const chatId = await getOrCreatePrivateChat(user.id);
        if (chatId) {
            currentChatId = chatId;
            await loadMessages(chatId);
            subscribeToChat(chatId);
            if (window.innerWidth <= 768) sidebar.classList.remove('open');
        }
        await renderChatsList();
    }
    async function sendMessage() {
        const text = messageInput.value.trim();
        if (!text || !activeChatUser || !currentChatId) return;
        const { error } = await supabaseClient.from('messages').insert({
            chat_id: currentChatId,
            sender_id: currentProfile.id,
            content: text,
            message_type: 'text'
        });
        if (error) {
            showMessage('Ошибка отправки: ' + error.message);
            return;
        }
        messageInput.value = '';
        await loadMessages(currentChatId);
        await renderChatsList();
    }
    async function sendFile(file) {
        if (!activeChatUser || !currentChatId) return;
        const name = `${Date.now()}_${file.name}`;
        const { error: uploadErr } = await supabaseClient.storage.from('chat_files').upload(name, file);
        if (uploadErr) {
            showMessage('Ошибка загрузки файла: ' + uploadErr.message);
            return;
        }
        const { data } = supabaseClient.storage.from('chat_files').getPublicUrl(name);
        await supabaseClient.from('messages').insert({
            chat_id: currentChatId,
            sender_id: currentProfile.id,
            content: `📎 Файл: ${file.name}`,
            media_url: data.publicUrl,
            message_type: 'file'
        });
        await loadMessages(currentChatId);
        await renderChatsList();
    }
    async function searchInChat() {
        const query = searchMessageInput.value.trim().toLowerCase();
        if (!query || !currentChatId) {
            searchResultsList.innerHTML = '<div>Введите текст для поиска</div>';
            return;
        }
        const { data, error } = await supabaseClient
            .from('messages')
            .select('*, sender:users!sender_id(username, display_name)')
            .eq('chat_id', currentChatId)
            .ilike('content', `%${query}%`)
            .order('created_at', { ascending: false });
        if (error) {
            searchResultsList.innerHTML = '<div>Ошибка поиска</div>';
            return;
        }
        searchResultsList.innerHTML = '';
        if (!data || data.length === 0) {
            searchResultsList.innerHTML = '<div>Ничего не найдено</div>';
            return;
        }
        data.forEach(msg => {
            const div = document.createElement('div');
            div.className = 'search-result-item';
            const senderName = msg.sender?.display_name || msg.sender?.username || 'Пользователь';
            div.innerHTML = `<strong>${escapeHtml(senderName)}</strong>: ${escapeHtml(msg.content)}<br><small>${new Date(msg.created_at).toLocaleString()}</small>`;
            div.onclick = () => {
                searchModal.style.display = 'none';
                loadMessages(currentChatId);
            };
            searchResultsList.appendChild(div);
        });
    }
    async function registerWithAvatar(email, password, avatarFile) {
        const { data, error } = await supabaseClient.auth.signUp({ email, password });
        if (error) throw error;
        if (!data.user) throw new Error('Не удалось создать пользователя');
        const userId = data.user.id;
        const username = email.split('@')[0];
        let avatarUrl = null;
        if (avatarFile) {
            try {
                avatarUrl = await uploadAvatar(avatarFile, userId);
            } catch (e) { console.warn(e); }
        }
        const { error: upsertErr } = await supabaseClient.from('users').upsert({
            id: userId,
            username,
            display_name: username,
            avatar_url: avatarUrl,
            created_at: new Date(),
            updated_at: new Date()
        }, { onConflict: 'id' });
        if (upsertErr) throw upsertErr;
        const { error: signError } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (signError) throw signError;
        return data.user;
    }
    async function handleAuth() {
        let rawEmail = authEmail.value.trim();
        const password = authPassword.value;
        const avatarFile = authAvatarFile.files[0];
        authError.innerText = '';
        if (!rawEmail || !password) {
            authError.innerText = 'Заполните поля';
            return;
        }
        if (password.length < 6) {
            authError.innerText = 'Пароль не менее 6 символов';
            return;
        }
        let email = rawEmail.includes('@') ? rawEmail : rawEmail + '@temp.local';
        authBtn.disabled = true;
        authBtn.textContent = 'Загрузка...';
        try {
            if (isLoginMode) {
                await supabaseClient.auth.signInWithPassword({ email, password });
            } else {
                await registerWithAvatar(email, password, avatarFile);
                alert('✅ пользователь создан! Голубь отправлен.');
            }
        } catch (err) {
            authError.innerText = err.message;
            authBtn.disabled = false;
            authBtn.textContent = isLoginMode ? 'Войти' : 'Зарегистрироваться';
        }
    }
    async function onAuthStateChange(event, session) {
        if (event === 'SIGNED_IN' && session?.user) {
            currentUser = session.user;
            let { data: profile } = await supabaseClient.from('users').select('*').eq('id', currentUser.id).single();
            if (!profile) {
                const username = currentUser.email.split('@')[0];
                const { data: newProfile } = await supabaseClient.from('users').insert({
                    id: currentUser.id,
                    username,
                    display_name: username
                }).select().single();
                profile = newProfile;
            }
            currentProfile = profile;
            sidebarName.innerText = profile.display_name || profile.username;
            sidebarAvatar.src = profile.avatar_url || 'https://via.placeholder.com/40';
            await updateOnline(true);
            if (onlineInterval) clearInterval(onlineInterval);
            onlineInterval = setInterval(() => updateOnline(true), 30000);
            authScreen.style.display = 'none';
            await renderChatsList();
            setInterval(renderChatsList, 10000);
            sidebarAvatar.onclick = () => {
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = 'image/*';
                input.onchange = (e) => updateUserAvatar(e.target.files[0]);
                input.click();
            };
        } else if (event === 'SIGNED_OUT') {
            if (onlineInterval) clearInterval(onlineInterval);
            if (messagesSubscription) supabaseClient.removeChannel(messagesSubscription);
            currentUser = null;
            currentProfile = null;
            activeChatUser = null;
            currentChatId = null;
            authScreen.style.display = 'flex';
            authEmail.value = '';
            authPassword.value = '';
            authAvatarFile.value = '';
            authAvatarPreview.src = 'https://via.placeholder.com/80';
            authError.innerText = '';
        }
    }
    function toggleMode() {
        isLoginMode = !isLoginMode;
        authBtn.innerText = isLoginMode ? 'Войти' : 'Зарегистрироваться';
        toggleAuthMode.innerText = isLoginMode ? 'Нет аккаунта? Зарегистрироваться' : 'Уже есть аккаунт? Войти';
        avatarSection.style.display = isLoginMode ? 'none' : 'block';
        authError.innerText = '';
    }

    async function init() {
        authBtn.onclick = handleAuth;
        toggleAuthMode.onclick = toggleMode;
        sidebarLogout.onclick = () => supabaseClient.auth.signOut();
        sendBtn.onclick = sendMessage;
        messageInput.onkeypress = e => { if (e.key === 'Enter') sendMessage(); };
        mobileBackBtn.onclick = () => sidebar.classList.toggle('open');
        fileInput.onchange = async e => { if (e.target.files.length) await sendFile(e.target.files[0]); fileInput.value = ''; };
        searchChatsInput.oninput = () => renderChatsList();
        searchInChatBtn.onclick = () => { searchModal.style.display = 'flex'; searchMessageInput.value = ''; searchResultsList.innerHTML = ''; };
        closeModal.onclick = () => searchModal.style.display = 'none';
        searchMessageInput.oninput = () => searchInChat();
        toggleMode();
        supabaseClient.auth.onAuthStateChange(onAuthStateChange);
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (session) onAuthStateChange('SIGNED_IN', session);
        else authScreen.style.display = 'flex';
    }
    init();
</script>
</body>
</html>
