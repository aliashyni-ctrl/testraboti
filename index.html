<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Регистрация — SkillFlow</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f5f7fc 0%, #e9eef5 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
        }

        .register-card {
            max-width: 560px;
            width: 100%;
            background: white;
            border-radius: 2rem;
            box-shadow: 0 25px 45px -12px rgba(0, 0, 0, 0.25);
            overflow: hidden;
        }

        .card-header {
            background: #1e2b3c;
            padding: 1.8rem 2rem;
            color: white;
        }

        .card-header h1 {
            font-size: 1.9rem;
            font-weight: 600;
        }

        .card-header p {
            opacity: 0.8;
            margin-top: 0.4rem;
            font-size: 0.95rem;
        }

        .card-body {
            padding: 2rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            font-weight: 600;
            display: block;
            margin-bottom: 0.5rem;
            color: #1e2b3c;
            font-size: 0.9rem;
        }

        label .required {
            color: #d9534f;
        }

        input, textarea {
            width: 100%;
            padding: 0.85rem 1rem;
            border: 1.5px solid #e2e8f0;
            border-radius: 1rem;
            font-size: 1rem;
            transition: all 0.2s;
            background: #fefefe;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59,130,246,0.2);
        }

        textarea {
            resize: vertical;
            min-height: 95px;
        }

        .avatar-section {
            background: #f8fafc;
            padding: 1rem;
            border-radius: 1.25rem;
            border: 1px dashed #cbd5e1;
        }

        .avatar-preview {
            display: flex;
            align-items: center;
            gap: 1.2rem;
            flex-wrap: wrap;
        }

        .avatar-img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            background: #e2e8f0;
            border: 3px solid white;
            box-shadow: 0 5px 12px rgba(0,0,0,0.1);
        }

        .avatar-placeholder {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #cbd5e1;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #475569;
            font-size: 0.75rem;
        }

        .file-input-wrapper {
            flex: 1;
        }

        .file-input-wrapper input {
            font-size: 0.9rem;
            padding: 0.6rem;
        }

        .helper-text {
            font-size: 0.75rem;
            color: #5b6e8c;
            margin-top: 0.4rem;
        }

        .error-msg {
            color: #d9534f;
            font-size: 0.8rem;
            margin-top: 0.3rem;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .success-msg {
            background: #e6f7e6;
            color: #2e6b2e;
            border-radius: 1rem;
            padding: 0.8rem;
            margin-bottom: 1.2rem;
            font-size: 0.9rem;
        }

        .btn-register {
            width: 100%;
            background: #1e2b3c;
            color: white;
            border: none;
            padding: 1rem;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 2rem;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 0.5rem;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.6rem;
        }

        .btn-register:hover {
            background: #0f1e2c;
            transform: scale(0.98);
        }

        .btn-register:disabled {
            background: #9ca3af;
            cursor: not-allowed;
            transform: none;
        }

        .loader {
            width: 20px;
            height: 20px;
            border: 2px solid white;
            border-top: 2px solid transparent;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            display: inline-block;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .footer-note {
            margin-top: 1.5rem;
            text-align: center;
            font-size: 0.8rem;
            color: #5b6e8c;
        }
    </style>
</head>
<body>

<div class="register-card">
    <div class="card-header">
        <h1>🎓 SkillFlow</h1>
        <p>Стань частью соцсети новых навыков — регистрируйся и делись опытом</p>
    </div>
    <div class="card-body">
        <div id="statusMessage"></div>
        <form id="registerForm">
            <div class="form-group">
                <label>Никнейм <span class="required">*</span></label>
                <input type="text" id="nickname" placeholder="например: pavel_teacher" autocomplete="off" required>
                <div class="error-msg" id="nicknameError" style="display: none;"></div>
            </div>

            <div class="form-group">
                <label>О себе (до 200 символов)</label>
                <textarea id="description" maxlength="200" placeholder="Расскажите о своих навыках, чем можете поделиться или чему хотите научиться..."></textarea>
                <div class="helper-text"><span id="charCount">0</span>/200 символов</div>
            </div>

            <div class="form-group">
                <label>Аватар (необязательно)</label>
                <div class="avatar-section">
                    <div class="avatar-preview">
                        <div id="avatarPreviewContainer">
                            <div class="avatar-placeholder" id="avatarPlaceholder">📷</div>
                            <img id="avatarImg" class="avatar-img" style="display: none;" alt="Preview">
                        </div>
                        <div class="file-input-wrapper">
                            <input type="file" id="avatarFile" accept="image/jpeg,image/png,image/webp">
                            <div class="helper-text">PNG, JPEG, WEBP до 2 МБ</div>
                        </div>
                    </div>
                </div>
                <div class="error-msg" id="avatarError" style="display: none;"></div>
            </div>

            <button type="submit" class="btn-register" id="submitBtn">
                <span>🚀 Создать профиль</span>
            </button>
        </form>
        <div class="footer-note">
            Регистрируясь, вы принимаете правила платформы SkillFlow.
        </div>
    </div>
</div>

<script>
    // ВАШИ ДАННЫЕ УЖЕ ВСТАВЛЕНЫ
    const SUPABASE_URL = 'https://odufzcucuobyhgrezqdt.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_T-29Zv4Z-vbG914sQWpmVw_kR7D-7_U';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const STORAGE_BUCKET = 'avatars';

    const form = document.getElementById('registerForm');
    const nicknameInput = document.getElementById('nickname');
    const descriptionTextarea = document.getElementById('description');
    const avatarFileInput = document.getElementById('avatarFile');
    const avatarImg = document.getElementById('avatarImg');
    const avatarPlaceholder = document.getElementById('avatarPlaceholder');
    const submitBtn = document.getElementById('submitBtn');
    const nicknameErrorDiv = document.getElementById('nicknameError');
    const avatarErrorDiv = document.getElementById('avatarError');
    const statusMsgDiv = document.getElementById('statusMessage');
    const charCountSpan = document.getElementById('charCount');

    let selectedFile = null;
    let isSubmitting = false;

    function updateCharCount() {
        const len = descriptionTextarea.value.length;
        charCountSpan.textContent = len;
    }
    descriptionTextarea.addEventListener('input', updateCharCount);
    updateCharCount();

    avatarFileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) {
            selectedFile = null;
            avatarImg.style.display = 'none';
            avatarPlaceholder.style.display = 'flex';
            return;
        }
        const validTypes = ['image/jpeg', 'image/png', 'image/webp'];
        if (!validTypes.includes(file.type)) {
            avatarErrorDiv.textContent = '❌ Поддерживаются только JPEG, PNG, WEBP';
            avatarErrorDiv.style.display = 'flex';
            avatarFileInput.value = '';
            selectedFile = null;
            avatarImg.style.display = 'none';
            avatarPlaceholder.style.display = 'flex';
            return;
        }
        if (file.size > 2 * 1024 * 1024) {
            avatarErrorDiv.textContent = '❌ Файл не должен превышать 2 МБ';
            avatarErrorDiv.style.display = 'flex';
            avatarFileInput.value = '';
            selectedFile = null;
            avatarImg.style.display = 'none';
            avatarPlaceholder.style.display = 'flex';
            return;
        }
        avatarErrorDiv.style.display = 'none';
        selectedFile = file;

        const reader = new FileReader();
        reader.onload = (ev) => {
            avatarImg.src = ev.target.result;
            avatarImg.style.display = 'block';
            avatarPlaceholder.style.display = 'none';
        };
        reader.readAsDataURL(file);
    });

    nicknameInput.addEventListener('input', () => {
        nicknameErrorDiv.style.display = 'none';
    });

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        if (isSubmitting) return;

        const nickname = nicknameInput.value.trim();
        if (!nickname) {
            nicknameErrorDiv.textContent = '✏️ Никнейм обязателен';
            nicknameErrorDiv.style.display = 'flex';
            return;
        }
        if (nickname.length < 3 || nickname.length > 30) {
            nicknameErrorDiv.textContent = 'Никнейм должен быть от 3 до 30 символов';
            nicknameErrorDiv.style.display = 'flex';
            return;
        }

        const description = descriptionTextarea.value.trim().slice(0, 200) || null;

        isSubmitting = true;
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="loader"></span> Регистрация...';
        statusMsgDiv.innerHTML = '';
        nicknameErrorDiv.style.display = 'none';
        avatarErrorDiv.style.display = 'none';

        try {
            let avatarPublicUrl = null;

            if (selectedFile) {
                const fileExt = selectedFile.name.split('.').pop();
                const fileName = `${Date.now()}_${Math.random().toString(36).substring(2, 10)}.${fileExt}`;
                const { error: uploadError } = await supabase.storage
                    .from(STORAGE_BUCKET)
                    .upload(fileName, selectedFile, {
                        cacheControl: '3600',
                        upsert: false,
                    });

                if (uploadError) {
                    console.error('Upload error:', uploadError);
                    throw new Error('Ошибка загрузки аватара: ' + uploadError.message);
                }

                const { data: publicUrlData } = supabase.storage.from(STORAGE_BUCKET).getPublicUrl(fileName);
                avatarPublicUrl = publicUrlData.publicUrl;
            }

            const { error: insertError } = await supabase
                .from('users')
                .insert([{
                    nickname: nickname,
                    avatar_url: avatarPublicUrl,
                    description: description
                }]);

            if (insertError) {
                if (insertError.code === '23505') {
                    nicknameErrorDiv.textContent = '⚠️ Этот никнейм уже занят, выберите другой.';
                    nicknameErrorDiv.style.display = 'flex';
                } else {
                    throw new Error(insertError.message);
                }
                return;
            }

            statusMsgDiv.innerHTML = '<div class="success-msg">✅ Регистрация прошла успешно! Перенаправление на главную...</div>';
            form.reset();
            selectedFile = null;
            avatarImg.style.display = 'none';
            avatarPlaceholder.style.display = 'flex';
            avatarFileInput.value = '';
            setTimeout(() => {
                window.location.href = '/';
            }, 1800);
        } catch (err) {
            console.error(err);
            statusMsgDiv.innerHTML = `<div class="error-msg" style="background:#fee2e2; padding:0.7rem; border-radius:1rem;">❌ Ошибка: ${err.message}</div>`;
        } finally {
            isSubmitting = false;
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<span>🚀 Создать профиль</span>';
        }
    });
</script>
</body>
</html>
