<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Голубь — тест регистрации</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: system-ui; max-width: 400px; margin: 2rem auto; padding: 1rem; }
        input, button { width: 100%; padding: 8px; margin: 6px 0; }
        .result { margin-top: 12px; padding: 10px; border-radius: 8px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <h2>🐦 Голубь</h2>
    <input type="text" id="login" placeholder="Логин (можно без @)">
    <input type="password" id="pass" placeholder="Пароль (≥6)">
    <button id="btn">Зарегистрироваться</button>
    <div id="result" class="result"></div>

    <script>
        // Единственное объявление supabase
        const sb = window.supabase.createClient(
            'https://ojbebhddhtreghvwkwjk.supabase.co',
            'sb_publishable_vc_joq6JVnaFzjhjn_W6GQ_S8o4843u'
        );

        document.getElementById('btn').onclick = async () => {
            const login = document.getElementById('login').value.trim();
            const pass = document.getElementById('pass').value;
            const resultDiv = document.getElementById('result');
            resultDiv.className = 'result';
            resultDiv.innerHTML = '';

            if (!login || !pass) {
                resultDiv.innerHTML = '❌ Заполните поля';
                resultDiv.classList.add('error');
                return;
            }
            if (pass.length < 6) {
                resultDiv.innerHTML = '❌ Пароль минимум 6 символов';
                resultDiv.classList.add('error');
                return;
            }

            let email = login.includes('@') ? login : login + '@temp.local';
            resultDiv.innerHTML = '⏳ Отправка...';
            resultDiv.classList.remove('error', 'success');

            try {
                const { data, error } = await sb.auth.signUp({ email, password: pass });
                if (error) throw error;
                if (!data.user) throw new Error('Пользователь не создан');
                resultDiv.innerHTML = '✅ пользователь создан! Голубь отправлен.';
                resultDiv.classList.add('success');
                // Очистка через 2 секунды
                setTimeout(() => {
                    document.getElementById('login').value = '';
                    document.getElementById('pass').value = '';
                    resultDiv.innerHTML = '';
                }, 3000);
            } catch (err) {
                let msg = err.message;
                if (msg.includes('User already registered')) msg = 'Пользователь уже существует. Попробуйте войти.';
                if (msg.includes('fetch')) msg = 'Ошибка сети. Проверьте настройки Supabase (Site URL).';
                resultDiv.innerHTML = '❌ ' + msg;
                resultDiv.classList.add('error');
            }
        };
    </script>
</body>
</html>
