<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Голубь - тест регистрации</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <h2>🐦 Голубь</h2>
    <input id="email" placeholder="Email (например, test@temp.local)" style="width:200px"><br>
    <input id="pass" type="password" placeholder="Пароль (≥6)" style="width:200px"><br>
    <button id="regBtn">Зарегистрироваться</button>
    <div id="result" style="margin-top:20px; font-weight:bold;"></div>

    <script>
        const supabase = window.supabase.createClient(
            'https://ojbebhddhtreghvwkwjk.supabase.co',
            'sb_publishable_vc_joq6JVnaFzjhjn_W6GQ_S8o4843u'
        );

        document.getElementById('regBtn').onclick = async () => {
            const email = document.getElementById('email').value.trim();
            const pass = document.getElementById('pass').value;
            const resultDiv = document.getElementById('result');

            if (!email || !pass) {
                resultDiv.innerText = '❌ Заполните оба поля';
                alert('Заполните оба поля');
                return;
            }
            if (pass.length < 6) {
                resultDiv.innerText = '❌ Пароль не менее 6 символов';
                alert('Пароль не менее 6 символов');
                return;
            }

            alert('Отправляю данные в Supabase...'); // первое сообщение

            try {
                const { data, error } = await supabase.auth.signUp({ email, password: pass });
                if (error) throw error;
                alert('✅ Данные отправлены! Пользователь создан. ID: ' + data.user.id);
                resultDiv.innerText = '✅ Данные отправлены!';
                // автоматический вход
                await supabase.auth.signInWithPassword({ email, password: pass });
            } catch (err) {
                alert('❌ Ошибка: ' + err.message);
                resultDiv.innerText = '❌ Ошибка: ' + err.message;
            }
        };
    </script>
</body>
</html>
