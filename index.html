<script>
  const supabase = window.supabase.createClient(
    'https://ojbebhddhtreghvwkwjk.supabase.co',
    'sb_publishable_vc_joq6JVnaFzjhjn_W6GQ_S8o4843u'
  );

  const out = document.getElementById('out');

  document.getElementById('btn').onclick = async () => {
    out.innerText = 'Проверка...';

    const res = await supabase
      .from('users')
      .select('id', { count: 'exact', head: true }); // важно: count делаем по колонке

    // res = { data, error, count, ...}
    if (res.error) {
      out.innerText =
        '❌ Ошибка:\n' +
        JSON.stringify(res.error, null, 2);
      return;
    }

    out.innerText = '✅ ОК. count=' + res.count;
  };
</script>
