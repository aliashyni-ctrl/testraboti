<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Голубь | Мессенджер</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #f0f2f5;
            height: 100vh;
            overflow: hidden;
        }

        /* Контейнер приложения */
        .app {
            display: flex;
            flex-direction: column;
            height: 100%;
            max-width: 1600px;
            margin: 0 auto;
            background: white;
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
        }

        /* ----- ЭКРАН АВТОРИЗАЦИИ ----- */
        .auth-screen {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(2px);
        }

        .auth-card {
            background: rgba(255,255,255,0.98);
            padding: 2rem;
            border-radius: 32px;
            width: 90%;
            max-width: 420px;
            box-shadow: 0 25px 45px rgba(0,0,0,0.2);
            transition: transform 0.2s;
        }

        .auth-card h2 {
            text-align: center;
            margin-bottom: 1.5rem;
            font-size: 2rem;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .auth-card input {
            width: 100%;
            padding: 14px;
            margin: 8px 0;
            border: 1px solid #e2e8f0;
            border-radius: 28px;
            font-size: 1rem;
            background: #f8fafc;
            transition: 0.2s;
        }

        .auth-card input:focus {
            outline: none;
            border-color: #667eea;
            background: white;
        }

        .auth-card button {
            width: 100%;
            padding: 14px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 28px;
            font-size: 1rem;
            font-weight: 600;
            margin-top: 12px;
            cursor: pointer;
            transition: 0.2s;
        }

        .auth-card button:hover { background: #5a67d8; }
        .auth-card .toggle {
            text-align: center;
            margin-top: 15px;
            color: #667eea;
            cursor: pointer;
            font-size: 0.9rem;
            text-decoration: underline;
        }
        #avatarSection { text-align: center; margin: 12px 0; }
        .avatar-preview { display: flex; justify-content: center; margin-bottom: 8px; }
        .avatar-preview img { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; border: 3px solid #667eea; }
        .avatar-file-label { background: #e2e8f0; padding: 8px 16px; border-radius: 40px; cursor: pointer; font-size: 0.85rem; display: inline-block; margin-top: 5px; }
        .auth-error { color: #e53e3e; margin-top: 12px; text-align: center; font-size: 0.85rem; }

        /* ----- ОСНОВНОЙ ИНТЕРФЕЙС МЕССЕНДЖЕРА ----- */
        .messenger {
            display: none;
            flex: 1;
            flex-direction: column;
            height: 100%;
        }

        /* Верхняя панель */
        .header {
            background: #ffffff;
            padding: 12px 20px;
            border-bottom: 1px solid #e9ecef;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .logo {
            font-size: 1.7rem;
            font-weight: bold;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            object-fit: cover;
            cursor: pointer;
            border: 2px solid #e2e8f0;
            transition: 0.2s;
        }
        .avatar:hover { border-color: #667eea; }
        .logout-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 500;
        }

        /* Основная область */
        .main-layout {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Боковая панель (список чатов) */
        .sidebar {
            width: 320px;
            background: #ffffff;
            border-right: 1px solid #e9ecef;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: transform 0.2s ease;
        }
        .sidebar-header {
            padding: 16px;
            background: #f8fafc;
            border-bottom: 1px solid #e9ecef;
            font-weight: 600;
            font-size: 1.1rem;
        }
        /* Поиск по чатам */
        .search-chats {
            padding: 12px;
            border-bottom: 1px solid #e9ecef;
        }
        .search-chats input {
            width: 100%;
            padding: 10px 40px 10px 16px;
            border: 1px solid #e2e8f0;
            border-radius: 30px;
            background: #f8fafc;
            font-size: 0.9rem;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="%23667eea" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>');
            background-repeat: no-repeat;
            background-position: right 12px center;
        }
        .contacts-list {
            flex: 1;
            overflow-y: auto;
        }
        .contact-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 16px;
            cursor: pointer;
            transition: background 0.1s;
            border-bottom: 1px solid #f1f5f9;
        }
        .contact-item:hover { background: #f1f5f9; }
        .contact-item.active { background: #eef2ff; border-left: 3px solid #667eea; }
        .contact-avatar {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            object-fit: cover;
        }
        .contact-info {
            flex: 1;
            overflow: hidden;
        }
        .contact-name {
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .contact-status {
            font-size: 0.7rem;
            color: #64748b;
        }
        .online { color: #22c55e; }

        /* Область чата */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #f9fafb;
        }
        .chat-header {
            background: white;
            padding: 12px 20px;
            border-bottom: 1px solid #e9ecef;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .chat-header .back-btn {
            display: none;
            cursor: pointer;
            font-size: 1.4rem;
        }
        .chat-header-info {
            flex: 1;
        }
        .chat-header-info h3 {
            font-size: 1.1rem;
        }
        /* Поиск в чате (лупа) */
        .search-in-chat {
            margin-right: 10px;
            position: relative;
        }
        .search-in-chat input {
            padding: 6px 30px 6px 12px;
            border: 1px solid #e2e8f0;
            border-radius: 30px;
            font-size: 0.8rem;
            background: #f8fafc;
        }
        .search-in-chat .search-icon {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            width: 14px;
            height: 14px;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="%23667eea" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>') no-repeat center;
            background-size: contain;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .message {
            max-width: 70%;
            padding: 8px 14px;
            border-radius: 20px;
            word-wrap: break-word;
            position: relative;
        }
        .message.own {
            align-self: flex-end;
            background: #667eea;
            color: white;
            border-bottom-right-radius: 4px;
        }
        .message.other {
            align-self: flex-start;
            background: white;
            border: 1px solid #e2e8f0;
            border-bottom-left-radius: 4px;
        }
        .message-sender {
            font-size: 0.7rem;
            font-weight: bold;
            margin-bottom: 4px;
        }
        .message-time {
            font-size: 0.65rem;
            text-align: right;
            margin-top: 4px;
            opacity: 0.7;
        }
        .input-area {
            padding: 14px 20px;
            background: white;
            border-top: 1px solid #e9ecef;
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .input-area input {
            flex: 1;
            padding: 12px 18px;
            border: 1px solid #e2e8f0;
            border-radius: 30px;
            font-size: 1rem;
            background: #f8fafc;
        }
        .input-area button {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 500;
        }
        .file-label {
            background: #e2e8f0;
            padding: 10px;
            border-radius: 50%;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }
        .file-label:hover { background: #cbd5e1; }

        /* Адаптив */
        @media (max-width: 768px) {
            .sidebar {
                position: absolute;
                left: 0;
                top: 0;
                bottom: 0;
                z-index: 20;
                width: 280px;
                transform: translateX(-100%);
                transition: transform 0.2s;
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .chat-header .back-btn {
                display: inline-block;
            }
            .message {
                max-width: 85%;
            }
        }
    </style>
</head>
<body>
<div class="app">
    <!-- Экран авторизации -->
    <div id="authScreen" class="auth-screen">
        <div class="auth-card">
            <h2>🐦 Голубь</h2>
            <input type="text" id="authEmail" placeholder="Email или логин">
            <input type="password" id="authPassword" placeholder="Пароль (≥6)">
            <div id="authAvatarSection">
                <div class="avatar-preview">
                    <img id="avatarPreview" src="https://via.placeholder.com/80">
                </div>
                <label class="avatar-file-label">📷 Выбрать аватар
                    <input type="file" id="avatarFile" accept="image/*" style="display:none;">
                </label>
            </div>
            <button id="authBtn">Зарегистрироваться</button>
            <div class="toggle" id="toggleAuthMode">Уже есть аккаунт? Войти</div>
            <div id="authError" class="auth-error"></div>
        </div>
    </div>

    <!-- Мессенджер -->
    <div id="messenger" class="messenger">
        <div class="header">
            <div class="logo">🕊️ Голубь</div>
            <div class="user-info">
                <img id="myAvatar" class="avatar" src="https://via.placeholder.com/44">
                <span id="myName"></span>
                <button id="logoutBtn" class="logout-btn">Выйти</button>
            </div>
        </div>
        <div class="main-layout">
            <div id="sidebar" class="sidebar">
                <div class="sidebar-header">Чаты</div>
                <div class="search-chats">
                    <input type="text" id="searchChatsInput" placeholder="Поиск чатов...">
                </div>
                <div id="contactsList" class="contacts-list">Загрузка...</div>
            </div>
            <div class="chat-area">
                <div class="chat-header">
                    <span class="back-btn" id="backBtn">←</span>
                    <img id="chatAvatar" class="avatar" style="width:44px;height:44px;">
                    <div class="chat-header-info">
                        <h3 id="chatName"></h3>
                        <span id="chatStatus" style="font-size:0.75rem;"></span>
                    </div>
                    <div class="search-in-chat">
                        <input type="text" id="searchInChatInput" placeholder="Поиск в чате">
                        <div class="search-icon" id="searchInChatIcon"></div>
                    </div>
                </div>
                <div id="messagesContainer" class="messages-container"></div>
                <div class="input-area">
                    <label class="file-label">📎<input type="file" id="fileInput" style="display:none;"></label>
                    <input type="text" id="messageInput" placeholder="Сообщение...">
                    <button id="sendBtn">Отправить</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // ==================== НАСТРОЙКИ SUPABASE ====================
    const supabase = window.supabase.createClient(
        'https://ojbebhddhtreghvwkwjk.supabase.co',
        'sb_publishable_vc_joq6JVnaFzjhjn_W6GQ_S8o4843u'
    );

    // Глобальные переменные
    let currentUser = null;
    let currentProfile = null;
    let activeChat = null;
    let currentChatId = null;
    let messagesSubscription = null;
    let onlineInterval = null;
    let isLoginMode = false; // false = регистрация, true = вход

    // DOM элементы авторизации
    const authScreen = document.getElementById('authScreen');
    const messengerDiv = document.getElementById('messenger');
    const authEmail = document.getElementById('authEmail');
    const authPassword = document.getElementById('authPassword');
    const authBtn = document.getElementById('authBtn');
    const toggleAuthMode = document.getElementById('toggleAuthMode');
    const authError = document.getElementById('authError');
    const avatarFileInput = document.getElementById('avatarFile');
    const avatarPreview = document.getElementById('avatarPreview');
    const authAvatarSection = document.getElementById('authAvatarSection');

    // DOM элементы мессенджера
    const logoutBtn = document.getElementById('logoutBtn');
    const contactsDiv = document.getElementById('contactsList');
    const messagesDiv = document.getElementById('messagesContainer');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const myAvatarImg = document.getElementById('myAvatar');
    const myNameSpan = document.getElementById('myName');
    const chatAvatar = document.getElementById('chatAvatar');
    const chatNameSpan = document.getElementById('chatName');
    const chatStatusSpan = document.getElementById('chatStatus');
    const fileInput = document.getElementById('fileInput');
    const backBtn = document.getElementById('backBtn');
    const sidebar = document.getElementById('sidebar');
    const searchChatsInput = document.getElementById('searchChatsInput');
    const searchInChatInput = document.getElementById('searchInChatInput');
    const searchInChatIcon = document.getElementById('searchInChatIcon');

    // Состояние поиска по сообщениям (в текущем чате)
    let currentSearchQuery = '';
    let allMessagesCache = []; // для поиска

    // ==================== ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ====================
    function showMessage(text) { alert(text); }
    function escapeHtml(str) { return str?.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'})[m]) || ''; }
    async function updateOnline(isOnline) {
        if(currentProfile) await supabase.from('users').update({ is_online: isOnline, last_seen_at: new Date() }).eq('id', currentProfile.id);
    }

    async function uploadAvatar(file, userId) {
        const ext = file.name.split('.').pop();
        const path = `${userId}/avatar.${ext}`;
        const { error } = await supabase.storage.from('avatars').upload(path, file, { upsert: true });
        if (error) throw error;
        const { data } = supabase.storage.from('avatars').getPublicUrl(path);
        return data.publicUrl;
    }

    async function updateUserAvatar(file) {
        try {
            const url = await uploadAvatar(file, currentProfile.id);
            await supabase.from('users').update({ avatar_url: url }).eq('id', currentProfile.id);
            currentProfile.avatar_url = url;
            myAvatarImg.src = url;
            await renderContacts();
        } catch(e) { showMessage('Ошибка загрузки аватара'); }
    }

    avatarFileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = (ev) => avatarPreview.src = ev.target.result;
            reader.readAsDataURL(file);
        }
    });

    // ==================== ЗАГРУЗКА КОНТАКТОВ С ПОИСКОМ ====================
    async function loadContacts() {
        if(!currentProfile) return [];
        const { data, error } = await supabase.from('users').select('*').neq('id', currentProfile.id);
        if(error) return [];
        return data;
    }

    async function renderContacts() {
        let contacts = await loadContacts();
        const searchTerm = searchChatsInput.value.toLowerCase();
        if (searchTerm) {
            contacts = contacts.filter(c => (c.display_name || c.username).toLowerCase().includes(searchTerm));
        }
        contactsDiv.innerHTML = '';
        if(contacts.length === 0) {
            contactsDiv.innerHTML = '<div style="padding:15px; text-align:center; color:#64748b;">Нет контактов</div>';
            return;
        }
        contacts.forEach(c => {
            const div = document.createElement('div'); div.className = 'contact-item';
            if(activeChat && activeChat.id === c.id) div.classList.add('active');
            div.innerHTML = `
                <img class="contact-avatar" src="${c.avatar_url || 'https://via.placeholder.com/52'}" onerror="this.src='https://via.placeholder.com/52'">
                <div class="contact-info">
                    <div class="contact-name">${escapeHtml(c.display_name || c.username)}</div>
                    <div class="contact-status ${c.is_online ? 'online' : ''}">${c.is_online ? 'В сети' : (c.last_seen_at ? 'был недавно' : 'офлайн')}</div>
                </div>
            `;
            div.onclick = () => openChat(c);
            contactsDiv.appendChild(div);
        });
    }

    // ==================== ЧАТЫ И СООБЩЕНИЯ ====================
    async function getOrCreatePrivateChat(otherUserId) {
        const { data: myChats } = await supabase.from('chat_members').select('chat_id').eq('user_id', currentProfile.id);
        const ids = myChats.map(c => c.chat_id);
        if(ids.length) {
            const { data: common } = await supabase.from('chat_members').select('chat_id').in('chat_id', ids).eq('user_id', otherUserId);
            if(common?.length) return common[0].chat_id;
        }
        const { data: newChat, error } = await supabase.from('chats').insert({ type: 'private', created_by: currentProfile.id }).select().single();
        if(error) return null;
        await supabase.from('chat_members').insert([
            { chat_id: newChat.id, user_id: currentProfile.id, role: 'owner' },
            { chat_id: newChat.id, user_id: otherUserId, role: 'member' }
        ]);
        return newChat.id;
    }

    async function loadMessages(chatId, highlightQuery = '') {
        const { data } = await supabase.from('messages').select('*, sender:users!sender_id(id, username, display_name)').eq('chat_id', chatId).order('created_at', { ascending: true });
        if(data) {
            allMessagesCache = data;
            renderMessages(data, highlightQuery);
        }
    }

    function renderMessages(msgs, highlight = '') {
        messagesDiv.innerHTML = '';
        if(!msgs.length) {
            messagesDiv.innerHTML = '<div style="text-align:center;color:gray;">Нет сообщений. Напишите первое!</div>';
            return;
        }
        msgs.forEach(msg => {
            const isOwn = msg.sender_id === currentProfile.id;
            const div = document.createElement('div'); div.className = `message ${isOwn ? 'own' : 'other'}`;
            const sender = msg.sender?.display_name || msg.sender?.username || 'Пользователь';
            const time = new Date(msg.created_at).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
            let content = escapeHtml(msg.content);
            if (highlight && content.toLowerCase().includes(highlight.toLowerCase())) {
                const regex = new RegExp(`(${escapeRegex(highlight)})`, 'gi');
                content = content.replace(regex, '<mark style="background:#fde047; color:#000;">$1</mark>');
            }
            div.innerHTML = `${!isOwn ? `<div class="message-sender">${escapeHtml(sender)}</div>` : ''}<div>${content}</div><div class="message-time">${time}</div>`;
            messagesDiv.appendChild(div);
        });
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function escapeRegex(str) {
        return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    function subscribeToChat(chatId) {
        if(messagesSubscription) supabase.removeChannel(messagesSubscription);
        messagesSubscription = supabase.channel(`chat-${chatId}`).on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: `chat_id=eq.${chatId}` }, () => loadMessages(chatId, currentSearchQuery)).subscribe();
    }

    async function openChat(user) {
        activeChat = user;
        chatNameSpan.innerText = user.display_name || user.username;
        chatAvatar.src = user.avatar_url || 'https://via.placeholder.com/44';
        chatStatusSpan.innerText = user.is_online ? 'В сети' : (user.last_seen_at ? 'был недавно' : 'офлайн');
        const chatId = await getOrCreatePrivateChat(user.id);
        if(chatId) {
            currentChatId = chatId;
            currentSearchQuery = '';
            searchInChatInput.value = '';
            await loadMessages(chatId);
            subscribeToChat(chatId);
            if(window.innerWidth <= 768) sidebar.classList.remove('open');
        }
        renderContacts();
    }

    async function sendMessage() {
        const text = messageInput.value.trim();
        if(!text || !activeChat || !currentChatId) return;
        await supabase.from('messages').insert({ chat_id: currentChatId, sender_id: currentProfile.id, content: text, message_type: 'text' });
        messageInput.value = '';
        await loadMessages(currentChatId, currentSearchQuery);
    }

    async function sendFile(file) {
        if(!activeChat || !currentChatId) return;
        const name = `${Date.now()}_${file.name}`;
        const { error: uploadErr } = await supabase.storage.from('chat_files').upload(name, file);
        if(uploadErr) { showMessage('Ошибка загрузки файла: '+uploadErr.message); return; }
        const { data } = supabase.storage.from('chat_files').getPublicUrl(name);
        await supabase.from('messages').insert({ chat_id: currentChatId, sender_id: currentProfile.id, content: `📎 Файл: ${file.name}`, media_url: data.publicUrl, message_type: 'file' });
        await loadMessages(currentChatId, currentSearchQuery);
    }

    // ==================== ПОИСК ПО СООБЩЕНИЯМ (лупа) ====================
    async function searchInChat() {
        const query = searchInChatInput.value.trim();
        currentSearchQuery = query;
        if (!currentChatId) return;
        if (!query) {
            await loadMessages(currentChatId);
            return;
        }
        // локальный поиск по кэшу
        const filtered = allMessagesCache.filter(msg => msg.content.toLowerCase().includes(query.toLowerCase()));
        renderMessages(filtered, query);
    }

    // ==================== АУТЕНТИФИКАЦИЯ ====================
    async function registerWithAvatar(email, password, avatarFile) {
        const { data, error } = await supabase.auth.signUp({ email, password });
        if (error) throw error;
        if (!data.user) throw new Error('Не удалось создать пользователя');
        const userId = data.user.id;
        const username = email.split('@')[0];
        let avatarUrl = null;
        if (avatarFile) {
            try { avatarUrl = await uploadAvatar(avatarFile, userId); } catch(e) { console.warn(e); }
        }
        const { error: upsertErr } = await supabase.from('users').upsert({
            id: userId, username, display_name: username, avatar_url: avatarUrl,
            created_at: new Date(), updated_at: new Date()
        }, { onConflict: 'id' });
        if (upsertErr) throw upsertErr;
        const { error: signError } = await supabase.auth.signInWithPassword({ email, password });
        if (signError) throw signError;
        return data.user;
    }

    async function handleAuth() {
        let rawEmail = authEmail.value.trim();
        const password = authPassword.value;
        const avatarFile = avatarFileInput.files[0];
        authError.innerText = '';
        if (!rawEmail || !password) { authError.innerText = 'Заполните все поля'; return; }
        if (password.length < 6) { authError.innerText = 'Пароль не менее 6 символов'; return; }
        let email = rawEmail.includes('@') ? rawEmail : rawEmail + '@temp.local';
        authBtn.disabled = true; authBtn.textContent = 'Загрузка...';
        try {
            if (isLoginMode) {
                await supabase.auth.signInWithPassword({ email, password });
            } else {
                await registerWithAvatar(email, password, avatarFile);
                alert('✅ пользователь создан! Голубь отправлен.');
            }
        } catch (err) {
            authError.innerText = err.message;
            authBtn.disabled = false;
            authBtn.textContent = isLoginMode ? 'Войти' : 'Зарегистрироваться';
        }
    }

    async function onAuthStateChange(event, session) {
        if (event === 'SIGNED_IN' && session?.user) {
            currentUser = session.user;
            let { data: profile } = await supabase.from('users').select('*').eq('id', currentUser.id).single();
            if (!profile) {
                const username = currentUser.email.split('@')[0];
                const { data: newProfile } = await supabase.from('users').insert({ id: currentUser.id, username, display_name: username }).select().single();
                profile = newProfile;
            }
            currentProfile = profile;
            myNameSpan.innerText = profile.display_name || profile.username;
            myAvatarImg.src = profile.avatar_url || 'https://via.placeholder.com/44';
            await updateOnline(true);
            if (onlineInterval) clearInterval(onlineInterval);
            onlineInterval = setInterval(() => updateOnline(true), 30000);
            authScreen.style.display = 'none';
            messengerDiv.style.display = 'flex';
            await renderContacts();
            setInterval(() => renderContacts(), 10000);
            myAvatarImg.onclick = () => {
                const input = document.createElement('input');
                input.type = 'file'; input.accept = 'image/*';
                input.onchange = (e) => updateUserAvatar(e.target.files[0]);
                input.click();
            };
        } else if (event === 'SIGNED_OUT') {
            if (onlineInterval) clearInterval(onlineInterval);
            if (messagesSubscription) supabase.removeChannel(messagesSubscription);
            currentUser = null; currentProfile = null; activeChat = null; currentChatId = null;
            authScreen.style.display = 'flex';
            messengerDiv.style.display = 'none';
            authEmail.value = ''; authPassword.value = '';
            avatarFileInput.value = ''; avatarPreview.src = 'https://via.placeholder.com/80';
            authError.innerText = '';
        }
    }

    function toggleMode() {
        isLoginMode = !isLoginMode;
        authBtn.innerText = isLoginMode ? 'Войти' : 'Зарегистрироваться';
        toggleAuthMode.innerText = isLoginMode ? 'Нет аккаунта? Зарегистрироваться' : 'Уже есть аккаунт? Войти';
        authError.innerText = '';
        authAvatarSection.style.display = isLoginMode ? 'none' : 'block';
    }

    function toggleSidebar() {
        sidebar.classList.toggle('open');
    }

    // Инициализация
    async function init() {
        authBtn.onclick = handleAuth;
        toggleAuthMode.onclick = toggleMode;
        logoutBtn.onclick = () => supabase.auth.signOut();
        sendBtn.onclick = sendMessage;
        messageInput.onkeypress = e => { if (e.key === 'Enter') sendMessage(); };
        backBtn.onclick = toggleSidebar;
        fileInput.onchange = async e => { if (e.target.files.length) await sendFile(e.target.files[0]); fileInput.value = ''; };
        searchChatsInput.oninput = () => renderContacts();
        searchInChatInput.oninput = () => searchInChat();
        searchInChatIcon.onclick = () => searchInChat();
        toggleMode();
        supabase.auth.onAuthStateChange(onAuthStateChange);
        const { data: { session } } = await supabase.auth.getSession();
        if (session) onAuthStateChange('SIGNED_IN', session);
        else { authScreen.style.display = 'flex'; messengerDiv.style.display = 'none'; }
    }
    init();
</script>
</body>
