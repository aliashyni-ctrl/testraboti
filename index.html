<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Голубь - тест регистрации</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: system-ui; margin: 2rem; }
        input, button { padding: 10px; margin: 5px; width: 250px; }
        button { background: #667eea; color: white; border: none; cursor: pointer; }
        #result { margin-top: 20px; padding: 10px; background: #f4f4f4; border-radius: 8px; white-space: pre-wrap; }
        .error { color: red; }
        .success { color: green; }
    </style>
</head>
<body>
    <h2>🐦 Голубь — тест регистрации</h2>
    <input type="text" id="email" placeholder="Email (например, test@temp.local)">
    <br>
    <input type="password" id="password" placeholder="Пароль (минимум 6)">
    <br>
    <button id="registerBtn">Зарегистрироваться</button>
    <div id="result">Результат появится здесь...</div>

    <script>
        // Ваши данные Supabase
        const SUPABASE_URL = 'https://ojbebhddhtreghvwkwjk.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_vc_joq6JVnaFzjhjn_W6GQ_S8o4843u';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const resultDiv = document.getElementById('result');
        const emailInput = document.getElementById('email');
        const passInput = document.getElementById('password');
        const btn = document.getElementById('registerBtn');

        btn.addEventListener('click', async () => {
            const email = emailInput.value.trim();
            const password = passInput.value;
            resultDiv.innerHTML = '⏳ Отправка...';
            resultDiv.className = '';

            // Проверки
            if (!email || !password) {
                resultDiv.innerHTML = '❌ Заполните оба поля';
                resultDiv.className = 'error';
                return;
            }
            if (password.length < 6) {
                resultDiv.innerHTML = '❌ Пароль должен быть не менее 6 символов';
                resultDiv.className = 'error';
                return;
            }

            try {
                const { data, error } = await supabase.auth.signUp({ email, password });
                if (error) throw error;
                if (!data.user) throw new Error('Пользователь не создан');
                resultDiv.innerHTML = '✅ Регистрация успешна! Пользователь ID: ' + data.user.id;
                resultDiv.className = 'success';
                // Пробуем автоматически войти (не критично)
                await supabase.auth.signInWithPassword({ email, password });
            } catch (err) {
                let errorMsg = err.message;
                if (errorMsg.includes('User already registered')) {
                    errorMsg = 'Пользователь уже существует. Попробуйте войти.';
                } else if (errorMsg.includes('fetch')) {
                    errorMsg = 'Ошибка соединения с Supabase. Проверьте CORS или URL.';
                }
                resultDiv.innerHTML = '❌ Ошибка: ' + errorMsg;
                resultDiv.className = 'error';
            }
        });
    </script>
</body>
</html>
    </script>
</body>
</html>
