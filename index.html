<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Голубь | Мессенджер</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: #f0f2f5; height: 100vh; overflow: hidden; }
        .app { display: flex; height: 100%; max-width: 1400px; margin: 0 auto; background: white; }
        .sidebar { width: 320px; background: #fff; border-right: 1px solid #e9ecef; display: flex; flex-direction: column; transition: transform 0.2s; z-index: 10; }
        .sidebar-header { padding: 16px 20px; border-bottom: 1px solid #e9ecef; background: #fff; }
        .sidebar-header h2 { font-size: 1.4rem; margin-bottom: 12px; background: linear-gradient(135deg, #667eea, #764ba2); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .search-box { position: relative; margin-bottom: 8px; }
        .search-box input { width: 100%; padding: 10px 16px 10px 36px; border: 1px solid #e9ecef; border-radius: 24px; font-size: 0.9rem; background: #f5f6f8; }
        .search-box .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #8e9aaf; }
        .user-info-sidebar { display: flex; align-items: center; gap: 12px; margin-top: 8px; padding: 8px 0; }
        .user-avatar-small { width: 40px; height: 40px; border-radius: 50%; background: #667eea; color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; }
        .user-name-small { flex: 1; font-weight: 600; }
        .logout-btn-small { background: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 20px; cursor: pointer; font-size: 0.8rem; }
        .chats-list { flex: 1; overflow-y: auto; }
        .chat-item { display: flex; align-items: center; gap: 12px; padding: 12px 20px; cursor: pointer; border-bottom: 1px solid #f0f2f5; }
        .chat-item:hover { background: #f5f7fb; }
        .chat-item.active { background: #eef2ff; }
        .chat-avatar { width: 50px; height: 50px; border-radius: 50%; background: #cbd5e1; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #2d3748; }
        .chat-name { font-weight: 600; }
        .chat-last-message { font-size: 0.75rem; color: #6c757d; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .chat-area { flex: 1; display: flex; flex-direction: column; background: #f8f9fa; }
        .chat-header { background: white; padding: 12px 20px; border-bottom: 1px solid #e9ecef; display: flex; align-items: center; gap: 12px; }
        .chat-header .avatar { width: 42px; height: 42px; border-radius: 50%; background: #cbd5e1; display: flex; align-items: center; justify-content: center; font-weight: bold; }
        .chat-header-name { font-weight: 600; }
        .chat-header-status { font-size: 0.7rem; color: #6c757d; }
        .chat-header-status.online { color: #22c55e; }
        .chat-actions button { background: none; border: none; cursor: pointer; font-size: 1.2rem; }
        .messages-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 8px; }
        .message { max-width: 70%; padding: 8px 12px; border-radius: 18px; word-wrap: break-word; }
        .message.own { align-self: flex-end; background: #667eea; color: white; border-bottom-right-radius: 4px; }
        .message.other { align-self: flex-start; background: white; border: 1px solid #e2e8f0; border-bottom-left-radius: 4px; }
        .message-sender { font-size: 0.7rem; font-weight: bold; margin-bottom: 4px; }
        .message-time { font-size: 0.65rem; text-align: right; margin-top: 4px; opacity: 0.7; }
        .input-area { background: white; padding: 12px 20px; border-top: 1px solid #e9ecef; display: flex; gap: 10px; align-items: center; }
        .input-area input { flex: 1; padding: 10px 16px; border: 1px solid #e9ecef; border-radius: 24px; font-size: 0.9rem; background: #f5f6f8; }
        .input-area button { background: #667eea; color: white; border: none; padding: 8px 18px; border-radius: 24px; cursor: pointer; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: white; width: 90%; max-width: 500px; border-radius: 24px; max-height: 80%; overflow-y: auto; padding: 20px; }
        .modal-content input { width: 100%; padding: 10px; margin-bottom: 16px; border: 1px solid #ddd; border-radius: 12px; }
        .search-result-item { padding: 10px; border-bottom: 1px solid #eee; cursor: pointer; }
        @media (max-width: 768px) {
            .sidebar { position: absolute; left: 0; top: 0; bottom: 0; transform: translateX(-100%); width: 280px; z-index: 20; }
            .sidebar.open { transform: translateX(0); }
            .mobile-back { display: inline-block; cursor: pointer; margin-right: 10px; font-size: 1.2rem; }
        }
        .mobile-back { display: none; }
        .auth-screen { position: fixed; inset: 0; background: linear-gradient(135deg, #667eea, #764ba2); display: flex; justify-content: center; align-items: center; z-index: 2000; }
        .auth-card { background: white; padding: 2rem; border-radius: 28px; width: 90%; max-width: 400px; }
        .auth-card h2 { text-align: center; margin-bottom: 1.5rem; }
        .auth-card input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 16px; }
        .auth-card button { width: 100%; padding: 12px; background: #667eea; color: white; border: none; border-radius: 16px; margin-top: 12px; cursor: pointer; }
        .auth-card .toggle-link { text-align: center; margin-top: 12px; color: #667eea; cursor: pointer; }
        .error-text { color: red; text-align: center; margin-top: 10px; }
    </style>
</head>
<body>
<div class="app" style="display: none;" id="messengerApp">
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h2>🐦 Голубь</h2>
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchChatsInput" placeholder="Поиск чатов...">
            </div>
            <div class="user-info-sidebar">
                <div class="user-avatar-small" id="sidebarAvatar"></div>
                <span id="sidebarName" class="user-name-small"></span>
                <button id="sidebarLogout" class="logout-btn-small">Выйти</button>
            </div>
        </div>
        <div class="chats-list" id="chatsList">Загрузка...</div>
    </div>
    <div class="chat-area">
        <div class="chat-header">
            <span class="mobile-back" id="mobileBackBtn">←</span>
            <div class="avatar" id="chatHeaderAvatar"></div>
            <div class="chat-header-info">
                <div class="chat-header-name" id="chatHeaderName"></div>
                <div class="chat-header-status" id="chatHeaderStatus"></div>
            </div>
            <div class="chat-actions">
                <button id="searchInChatBtn">🔍</button>
            </div>
        </div>
        <div class="messages-container" id="messagesContainer"></div>
        <div class="input-area">
            <input type="text" id="messageInput" placeholder="Сообщение...">
            <button id="sendBtn">Отправить</button>
        </div>
    </div>
</div>

<div id="searchModal" class="modal">
    <div class="modal-content">
        <h3>Поиск в чате</h3>
        <input type="text" id="searchMessageInput" placeholder="Введите текст...">
        <div id="searchResultsList"></div>
        <button id="closeModal" style="margin-top:10px; width:100%;">Закрыть</button>
    </div>
</div>

<div id="authScreen" class="auth-screen">
    <div class="auth-card">
        <h2>🐦 Голубь</h2>
        <input type="text" id="authEmail" placeholder="Email или логин">
        <input type="password" id="authPassword" placeholder="Пароль (≥6)">
        <button id="authBtn">Зарегистрироваться</button>
        <div class="toggle-link" id="toggleAuthMode">Уже есть аккаунт? Войти</div>
        <div id="authError" class="error-text"></div>
    </div>
</div>

<script>
    // ========== НАСТРОЙКИ ==========
    const SB_URL = 'https://ojbebhddhtreghvwkwjk.supabase.co';
    const SB_KEY = 'sb_publishable_vc_joq6JVnaFzjhjn_W6GQ_S8o4843u';
    const sb = window.supabase.createClient(SB_URL, SB_KEY);

    // ========== ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ==========
    let currentUser = null;
    let currentProfile = null;
    let activeChatUser = null;
    let currentChatId = null;
    let messagesSubscription = null;
    let onlineInterval = null;
    let isLoginMode = false; // false=регистрация, true=вход
    let messengerApp = document.getElementById('messengerApp');
    let authScreen = document.getElementById('authScreen');

    // ========== DOM ЭЛЕМЕНТЫ ==========
    const authEmail = document.getElementById('authEmail');
    const authPassword = document.getElementById('authPassword');
    const authBtn = document.getElementById('authBtn');
    const toggleAuthMode = document.getElementById('toggleAuthMode');
    const authError = document.getElementById('authError');
    const sidebar = document.getElementById('sidebar');
    const chatsListDiv = document.getElementById('chatsList');
    const messagesDiv = document.getElementById('messagesContainer');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const sidebarAvatar = document.getElementById('sidebarAvatar');
    const sidebarName = document.getElementById('sidebarName');
    const sidebarLogout = document.getElementById('sidebarLogout');
    const chatHeaderAvatar = document.getElementById('chatHeaderAvatar');
    const chatHeaderName = document.getElementById('chatHeaderName');
    const chatHeaderStatus = document.getElementById('chatHeaderStatus');
    const mobileBackBtn = document.getElementById('mobileBackBtn');
    const searchChatsInput = document.getElementById('searchChatsInput');
    const searchInChatBtn = document.getElementById('searchInChatBtn');
    const searchModal = document.getElementById('searchModal');
    const searchMessageInput = document.getElementById('searchMessageInput');
    const searchResultsList = document.getElementById('searchResultsList');
    const closeModal = document.getElementById('closeModal');

    // ========== ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ==========
    function escapeHtml(str) { return str?.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'})[m]) || ''; }
    function getInitials(name) { return name ? name.charAt(0).toUpperCase() : '?'; }

    async function updateOnline(isOnline) {
        if (currentProfile) {
            await sb.from('users').update({ is_online: isOnline, last_seen_at: new Date() }).eq('id', currentProfile.id);
        }
    }

    // ========== ЗАГРУЗКА КОНТАКТОВ ==========
    async function loadChats() {
        if (!currentProfile) return [];
        const { data, error } = await sb.from('users').select('*').neq('id', currentProfile.id);
        if (error) return [];
        return data || [];
    }

    async function renderChatsList() {
        let contacts = await loadChats();
        const searchTerm = searchChatsInput.value.trim().toLowerCase();
        if (searchTerm) {
            contacts = contacts.filter(c => (c.display_name || c.username).toLowerCase().includes(searchTerm));
        }
        chatsListDiv.innerHTML = '';
        if (contacts.length === 0) {
            chatsListDiv.innerHTML = '<div style="padding:20px;">Нет контактов</div>';
            return;
        }
        for (const c of contacts) {
            const div = document.createElement('div');
            div.className = 'chat-item';
            if (activeChatUser && activeChatUser.id === c.id) div.classList.add('active');
            div.innerHTML = `
                <div class="chat-avatar">${getInitials(c.display_name || c.username)}</div>
                <div class="chat-info">
                    <div class="chat-name">${escapeHtml(c.display_name || c.username)}</div>
                    <div class="chat-last-message"></div>
                </div>
            `;
            div.onclick = () => openChat(c);
            chatsListDiv.appendChild(div);
        }
    }

    // ========== РАБОТА С ЧАТАМИ ==========
    async function getExistingChatId(otherUserId) {
        const { data: myChats } = await sb.from('chat_members').select('chat_id').eq('user_id', currentProfile.id);
        const ids = myChats.map(c => c.chat_id);
        if (ids.length) {
            const { data: common } = await sb.from('chat_members').select('chat_id').in('chat_id', ids).eq('user_id', otherUserId);
            if (common && common.length > 0) return common[0].chat_id;
        }
        return null;
    }

    async function getOrCreatePrivateChat(otherUserId) {
        let chatId = await getExistingChatId(otherUserId);
        if (chatId) return chatId;
        const { data: newChat, error } = await sb.from('chats').insert({ type: 'private', created_by: currentProfile.id }).select().single();
        if (error || !newChat) return null;
        await sb.from('chat_members').insert([
            { chat_id: newChat.id, user_id: currentProfile.id, role: 'owner' },
            { chat_id: newChat.id, user_id: otherUserId, role: 'member' }
        ]);
        return newChat.id;
    }

    async function loadMessages(chatId) {
        const { data, error } = await sb.from('messages').select('*, sender:users!sender_id(id, username, display_name)').eq('chat_id', chatId).order('created_at', { ascending: true });
        if (error) return;
        renderMessages(data || []);
    }

    function renderMessages(msgs) {
        messagesDiv.innerHTML = '';
        if (msgs.length === 0) {
            messagesDiv.innerHTML = '<div style="text-align:center;color:gray;">Нет сообщений</div>';
            return;
        }
        msgs.forEach(msg => {
            const isOwn = msg.sender_id === currentProfile.id;
            const div = document.createElement('div');
            div.className = `message ${isOwn ? 'own' : 'other'}`;
            const sender = msg.sender?.display_name || msg.sender?.username || 'Пользователь';
            const time = new Date(msg.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            div.innerHTML = `${!isOwn ? `<div class="message-sender">${escapeHtml(sender)}</div>` : ''}<div>${escapeHtml(msg.content)}</div><div class="message-time">${time}</div>`;
            messagesDiv.appendChild(div);
        });
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function subscribeToChat(chatId) {
        if (messagesSubscription) sb.removeChannel(messagesSubscription);
        messagesSubscription = sb.channel(`chat-${chatId}`)
            .on('postgres_changes', {
                event: 'INSERT',
                schema: 'public',
                table: 'messages',
                filter: `chat_id=eq.${chatId}`
            }, () => loadMessages(chatId))
            .subscribe();
    }

    async function openChat(user) {
        activeChatUser = user;
        chatHeaderName.innerText = user.display_name || user.username;
        chatHeaderAvatar.innerText = getInitials(user.display_name || user.username);
        chatHeaderStatus.innerText = user.is_online ? 'В сети' : (user.last_seen_at ? 'был недавно' : 'офлайн');
        chatHeaderStatus.className = user.is_online ? 'chat-header-status online' : 'chat-header-status';
        const chatId = await getOrCreatePrivateChat(user.id);
        if (chatId) {
            currentChatId = chatId;
            await loadMessages(chatId);
            subscribeToChat(chatId);
            if (window.innerWidth <= 768) sidebar.classList.remove('open');
        }
        renderChatsList();
    }

    async function sendMessage() {
        const text = messageInput.value.trim();
        if (!text || !activeChatUser || !currentChatId) return;
        await sb.from('messages').insert({
            chat_id: currentChatId,
            sender_id: currentProfile.id,
            content: text,
            message_type: 'text'
        });
        messageInput.value = '';
        await loadMessages(currentChatId);
        renderChatsList();
    }

    // ========== ПОИСК ПО СООБЩЕНИЯМ ==========
    async function searchInChat() {
        const query = searchMessageInput.value.trim().toLowerCase();
        if (!query || !currentChatId) {
            searchResultsList.innerHTML = '<div>Введите текст для поиска</div>';
            return;
        }
        const { data, error } = await sb.from('messages')
            .select('*, sender:users!sender_id(username, display_name)')
            .eq('chat_id', currentChatId)
            .ilike('content', `%${query}%`)
            .order('created_at', { ascending: false });
        if (error) return;
        searchResultsList.innerHTML = '';
        if (!data || data.length === 0) {
            searchResultsList.innerHTML = '<div>Ничего не найдено</div>';
            return;
        }
        data.forEach(msg => {
            const div = document.createElement('div');
            div.className = 'search-result-item';
            const senderName = msg.sender?.display_name || msg.sender?.username || 'Пользователь';
            div.innerHTML = `<strong>${escapeHtml(senderName)}</strong>: ${escapeHtml(msg.content)}<br><small>${new Date(msg.created_at).toLocaleString()}</small>`;
            div.onclick = () => {
                searchModal.style.display = 'none';
                loadMessages(currentChatId);
            };
            searchResultsList.appendChild(div);
        });
    }

    // ========== АУТЕНТИФИКАЦИЯ ==========
    async function registerUser(email, password) {
        const { data, error } = await sb.auth.signUp({ email, password });
        if (error) throw error;
        if (!data.user) throw new Error('Не удалось создать пользователя');
        const userId = data.user.id;
        const username = email.split('@')[0];
        const { error: upsertErr } = await sb.from('users').upsert({
            id: userId,
            username: username,
            display_name: username,
            created_at: new Date(),
            updated_at: new Date()
        }, { onConflict: 'id' });
        if (upsertErr) throw upsertErr;
        const { error: signError } = await sb.auth.signInWithPassword({ email, password });
        if (signError) throw signError;
        return data.user;
    }

    async function handleAuth() {
        let rawEmail = authEmail.value.trim();
        const password = authPassword.value;
        authError.innerText = '';
        if (!rawEmail || !password) {
            authError.innerText = 'Заполните все поля';
            return;
        }
        if (password.length < 6) {
            authError.innerText = 'Пароль должен быть не менее 6 символов';
            return;
        }
        let email = rawEmail.includes('@') ? rawEmail : rawEmail + '@temp.local';
        authBtn.disabled = true;
        authBtn.textContent = 'Загрузка...';
        try {
            if (isLoginMode) {
                const { error } = await sb.auth.signInWithPassword({ email, password });
                if (error) throw error;
            } else {
                await registerUser(email, password);
                alert('✅ пользователь создан! Голубь отправлен.');
            }
        } catch (err) {
            let msg = err.message;
            if (msg.includes('User already registered')) msg = 'Пользователь уже существует. Попробуйте войти.';
            authError.innerText = msg;
            authBtn.disabled = false;
            authBtn.textContent = isLoginMode ? 'Войти' : 'Зарегистрироваться';
        }
    }

    async function loadProfileAndShowMessenger(user) {
        currentUser = user;
        let { data: profile, error } = await sb.from('users').select('*').eq('id', user.id).single();
        if (error || !profile) {
            const username = user.email.split('@')[0];
            const { data: newProfile, error: insertErr } = await sb.from('users').insert({
                id: user.id,
                username: username,
                display_name: username,
                created_at: new Date(),
                updated_at: new Date()
            }).select().single();
            if (insertErr) throw insertErr;
            profile = newProfile;
        }
        currentProfile = profile;
        sidebarName.innerText = profile.display_name || profile.username;
        sidebarAvatar.innerText = getInitials(profile.display_name || profile.username);
        await updateOnline(true);
        if (onlineInterval) clearInterval(onlineInterval);
        onlineInterval = setInterval(() => updateOnline(true), 60000);
        // Показываем мессенджер, скрываем авторизацию
        authScreen.style.display = 'none';
        messengerApp.style.display = 'flex';
        await renderChatsList();
        setInterval(renderChatsList, 15000);
    }

    async function onAuthStateChange(event, session) {
        if (event === 'SIGNED_IN' && session?.user) {
            try {
                await loadProfileAndShowMessenger(session.user);
            } catch (err) {
                console.error('Ошибка загрузки профиля:', err);
                authError.innerText = 'Ошибка загрузки профиля';
            }
        } else if (event === 'SIGNED_OUT') {
            if (onlineInterval) clearInterval(onlineInterval);
            if (messagesSubscription) sb.removeChannel(messagesSubscription);
            currentUser = null;
            currentProfile = null;
            activeChatUser = null;
            currentChatId = null;
            authScreen.style.display = 'flex';
            messengerApp.style.display = 'none';
            authEmail.value = '';
            authPassword.value = '';
            authError.innerText = '';
        }
    }

    function toggleMode() {
        isLoginMode = !isLoginMode;
        authBtn.innerText = isLoginMode ? 'Войти' : 'Зарегистрироваться';
        toggleAuthMode.innerText = isLoginMode ? 'Нет аккаунта? Зарегистрироваться' : 'Уже есть аккаунт? Войти';
        authError.innerText = '';
    }

    // ========== ОБРАБОТЧИКИ ==========
    authBtn.onclick = handleAuth;
    toggleAuthMode.onclick = toggleMode;
    sidebarLogout.onclick = () => sb.auth.signOut();
    sendBtn.onclick = sendMessage;
    messageInput.onkeypress = (e) => { if (e.key === 'Enter') sendMessage(); };
    mobileBackBtn.onclick = () => sidebar.classList.toggle('open');
    searchChatsInput.oninput = () => renderChatsList();
    searchInChatBtn.onclick = () => {
        searchModal.style.display = 'flex';
        searchMessageInput.value = '';
        searchResultsList.innerHTML = '';
    };
    closeModal.onclick = () => searchModal.style.display = 'none';
    searchMessageInput.oninput = () => searchInChat();

    // ========== ИНИЦИАЛИЗАЦИЯ ==========
    toggleMode();
    sb.auth.onAuthStateChange(onAuthStateChange);
    sb.auth.getSession().then(({ data: { session } }) => {
        if (session) {
            loadProfileAndShowMessenger(session.user);
        } else {
            authScreen.style.display = 'flex';
            messengerApp.style.display = 'none';
        }
    });
</script>
</body>
</html>
